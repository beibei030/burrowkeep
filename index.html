<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>轮谱 · Burrowkeep</title>
  <meta name="description" content="Confirmed Squeekchain rounds stitch a cloth and a score. The pen moves only while the hamster runs.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%236b4a36' width='32' height='32'/%3E%3Crect x='6' y='20' width='4' height='6' fill='%23e2a04a'/%3E%3Crect x='14' y='8' width='4' height='18' fill='%23f6e7a8'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #16120e; color: #f3e6d0; font: 16px/1.4 "Segoe UI", "PingFang SC", sans-serif; }
    .layout { width: min(1180px, calc(100% - 24px)); margin: 16px auto 28px; display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; align-items: start; }
    .loom { background: #120e0b; border: 4px solid #3c2e24; box-shadow: 0 0 0 4px #1a140f; padding: 12px; overflow-x: auto; min-width: 0; }
    canvas { height: auto; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    aside { background: #241c16; border: 2px solid #5a4636; padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 260px; }
    .title-row { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
    .kicker { margin: 0; color: #e7b15a; letter-spacing: 0.08em; text-transform: uppercase; font-size: 11px; }
    h1 { margin: 2px 0 0; font-size: 28px; }
    button { font: inherit; color: #f3e6d0; background: #241c16; border: 2px solid #5a4636; padding: 8px 10px; }
    button:active { transform: translateY(1px); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    #live, #picked, footer { margin: 0; color: #d9c7ae; }
    footer a { color: #f0b15a; }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="layout">
    <div class="loom">
      <canvas id="cloth" width="320" height="92"></canvas>
    </div>
    <aside>
      <div class="title-row">
        <div>
          <p class="kicker">Burrowkeep</p>
          <h1>轮谱</h1>
        </div>
        <button id="lang" type="button"></button>
      </div>
      <p id="live"></p>
      <p id="picked"></p>
      <div class="actions">
        <button id="play" type="button"></button>
        <button id="png" type="button"></button>
        <button id="midi" type="button"></button>
      </div>
      <footer>
        <p id="footer-line"></p>
        <p><a id="stream-link" href="https://sepolia.squeekchain.com/#stream-game"></a> · <a href="https://squeekchain.com/">Squeekchain</a></p>
      </footer>
    </aside>
  </main>
  <script type="module" src="score.js"></script>
</body>
</html>
